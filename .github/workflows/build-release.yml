name: Build & Release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.23.x'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            bin: HexLoader
            archive: HexLoader-linux-amd64.tar.gz
            cgo_cflags: "-DGLFW_EXPOSE_NATIVE_X11 -DGLFW_EXPOSE_NATIVE_WAYLAND=0"

          - os: ubuntu-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            bin: HexLoader.exe
            archive: HexLoader-windows-amd64.zip
            cc: x86_64-w64-mingw32-gcc
            cgo_cflags: ""

          # macos-13 больше не существует, используем macos-15-intel
          - os: macos-15-intel
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            bin: HexLoader
            archive: HexLoader-macos-amd64.tar.gz
            cgo_cflags: ""

          - os: macos-14
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            bin: HexLoader
            archive: HexLoader-macos-arm64.tar.gz
            cgo_cflags: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev libglx-dev \
            xorg-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            pkg-config gcc-mingw-w64-x86-64

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-v5-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-v5-

      - run: go mod download

      - run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC:     ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cgo_cflags }}
        run: |
          go build -v -trimpath \
            -ldflags "-s -w" \
            -o "${{ matrix.bin }}" .

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" "${{ matrix.bin }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"

      # Защита от сбоев GitHub (CreateArtifact timeout)
      - name: Upload artifact (attempt 1)
        id: upload1
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Wait before retry
        if: steps.upload1.outcome == 'failure'
        run: sleep 20

      - name: Upload artifact (attempt 2)
        id: upload2
        if: steps.upload1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Wait before retry
        if: steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure'
        run: sleep 40

      - name: Upload artifact (attempt 3)
        if: steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}